[project]
name = "openapi-mcp"
version = "0.1.0"
description = "MCP server that reads an OpenAPI spec and generates/executes sample CRUD data against the API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "faker>=30.0",
]

[project.scripts]
openapi-mcp = "openapi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_mcp"]
