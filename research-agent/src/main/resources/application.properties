spring.application.name=research-agent

server.port=8080
# webflux is on the classpath (MCP client transport uses WebClient) -> force servlet
spring.main.web-application-type=servlet

# ---- MCP client: connect to the news-search-tool server and discover its tools ----
# "news" is just a label for this connection; the tool name (searchNews) is
# learned at runtime via tools/list, NOT configured here.
spring.ai.mcp.client.sse.connections.news.url=http://localhost:8090
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s

# ---- Gemini chat via Google's OpenAI-compatible endpoint (free tier) ----
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY:dummy-key-replace-me}
spring.ai.openai.chat.options.model=gemini-flash-lite-latest
# the OpenAI starter also auto-configures an embedding model by default;
# disable it so it doesn't collide with the google-genai one below.
spring.ai.model.embedding=none

# ---- Gemini embeddings via the native Google GenAI module (for RAG) ----
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:dummy-key-replace-me}
spring.ai.google.genai.embedding.vertex-ai=false
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
