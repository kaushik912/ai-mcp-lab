server:
  port: 8080

spring:
  application:
    name: sample-client
  ai:
    mcp:
      client:
        sse:
          connections:
            person-mcp-server:
              url: http://localhost:8060
            account-mcp-server:
              url: http://localhost:8040
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}

logging:
  level:
    io.modelcontextprotocol: DEBUG
